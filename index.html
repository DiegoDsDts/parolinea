<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="theme-color" content="#191b18" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parolinea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (() => {
        const lightColor = '#f7f5ef';
        const darkColor = '#191b18';
        const storageKey = 'parolinea/theme-preference';
        const storedTheme = localStorage.getItem(storageKey);
        const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const effectiveTheme = storedTheme === 'dark' || (storedTheme !== 'light' && systemDark) ? 'dark' : 'light';
        const themeColor = effectiveTheme === 'dark' ? darkColor : lightColor;

        document.documentElement.dataset.theme = effectiveTheme;
        document.querySelector('meta[name="theme-color"]:not([media])')?.setAttribute('content', themeColor);
      })();
    </script>
    <meta
      name="description"
      content="Parolinea"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Parolinea</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
